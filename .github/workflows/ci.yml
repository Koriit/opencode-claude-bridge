name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Coverage gate (≥90% global)
        run: bun run test:coverage

      # The e2e suite is excluded from CI: it requires real `opencode` and `claude`
      # binaries on PATH, which are not available on stock GitHub Actions runners.
      # Run `bun run test:e2e` locally or in a canary environment after every
      # OpenCode upgrade (before widening the supported version range in package.json).
