[test]
# Coverage reporter settings used by `bun test --coverage`.
# The global 90% floor is enforced by scripts/coverage-gate.ts (called via
# `bun run test:coverage`) rather than bunfig.toml's coverageThreshold because
# Bun 1.3.14 applies both the scalar and table threshold forms per-file. Two
# source files (src/logger.ts, src/index.ts) report ~75% function coverage due
# to V8 instrumentation artifacts (class-field initializer and async catch-handler
# counted as separate "functions" even though both are fully exercised). A
# per-file threshold of ≥0.90 would always fail on those artifacts, so the
# meaningful global floor lives in the gate script instead.
coverageReporter = ["text"]
coverageDir = "coverage"
coverageSkipTestFiles = true
